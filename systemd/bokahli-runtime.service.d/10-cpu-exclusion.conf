# Exclude the degraded physical core from this service.
#
# Physical core 4 — logical CPUs 8 and 9 — computes wrong answers from Node's
# vectorized base64 encoder at ~1.1e-3, silently, with no machine-check
# exception. Twenty-two logical CPUs are clean over 3.3 million attempts; those
# two are not. See docs/incidents/2026-08-20-host-base64.md.
#
# CPUAffinity=, not AllowedCPUs=.
#
# AllowedCPUs= is the cgroup mechanism and is the better one, but it does not
# work here and does not say so: the `cpuset` controller is present at the root
# cgroup and absent from `cgroup.subtree_control` at every level, and
# user@1000.service is delegated `cpu io memory pids` only. A user unit with
# AllowedCPUs=0-7,10-23 starts, logs nothing, and runs on 0-23. Turning that on
# would mean root editing the root cgroup's subtree_control, which is a
# machine-wide change to every cgroup on the host, not a change to this service.
#
# CPUAffinity= is sched_setaffinity in the child before exec. It is verified on
# this host to take effect and to be inherited by grandchildren, and it needs no
# controller, no delegation and no privilege.
#
# This governs FUTURE starts only. Existing threads were confined in place with
# sched_setaffinity; neither service was restarted to apply it.
[Service]
CPUAffinity=0-7,10-23
